name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Tests (${{ matrix.python-version }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Mac Agent & Protocol Tests
        run: |
          python3 -m unittest discover -s mac-agent/tests -t mac-agent -v

      - name: Run Relay Tests
        run: |
          python3 -m unittest relay/tests/test_relay.py -v

      - name: Run Demo Suite (--all --fast)
        run: |
          python3 mac-agent/demo.py --all --fast

  test-web:
    name: Web Matrix Engine & Build on Ubuntu
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Matrix Engine Tests
        run: npm test

      - name: Build Web Application
        run: npm run build
